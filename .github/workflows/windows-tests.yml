name: Windows compatibility tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell-5:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run isolated config tests with Windows PowerShell 5.1
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'cst-ps5-tests.log'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./tests/Run-Tests.ps1 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $tail = (Get-Content -LiteralPath $log -Tail 80) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host ('::error title=Windows PowerShell 5.1 test log::' + $escaped)
          }
          exit $testExit
      - name: Scan repository for committed secrets and private paths
        if: always()
        shell: powershell
        run: ./tests/Test-RepositoryHygiene.ps1

  powershell-7:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run isolated config tests with PowerShell 7
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'cst-ps7-tests.log'
          & pwsh.exe -NoLogo -NoProfile -File ./tests/Run-Tests.ps1 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $tail = (Get-Content -LiteralPath $log -Tail 80) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host ('::error title=PowerShell 7 test log::' + $escaped)
          }
          exit $testExit
      - name: Scan repository for committed secrets and private paths
        if: always()
        shell: pwsh
        run: ./tests/Test-RepositoryHygiene.ps1

  gui-build-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build and self-test the Chinese WinForms executable
        shell: powershell
        run: ./tests/Test-GuiSmoke.ps1
