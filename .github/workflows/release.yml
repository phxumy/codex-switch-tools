name: Windows executable release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/windows-tests.yml

  publish:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Verify release version and notes
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version."
          }
          $notesPath = Join-Path releases "$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Missing release notes: $notesPath"
          }
      - name: Build standalone Windows executable
        shell: powershell
        run: ./build-gui.ps1
      - name: Prepare download assets and checksum
        shell: pwsh
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'cst-release-assets'
          New-Item -ItemType Directory -Path $assetDirectory -Force | Out-Null
          $exePath = Join-Path $assetDirectory 'CodexSwitchTools.exe'
          Copy-Item -LiteralPath dist/CodexSwitchTools.exe -Destination $exePath
          $hash = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash
          "$hash  CodexSwitchTools.exe" | Set-Content -LiteralPath (Join-Path $assetDirectory 'SHA256SUMS.txt') -Encoding utf8NoBOM
          "RELEASE_ASSET_DIRECTORY=$assetDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish versioned EXE and SHA-256 file
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesPath = Join-Path releases "$env:GITHUB_REF_NAME.md"
          $exePath = Join-Path $env:RELEASE_ASSET_DIRECTORY 'CodexSwitchTools.exe'
          $hashPath = Join-Path $env:RELEASE_ASSET_DIRECTORY 'SHA256SUMS.txt'
          gh release create $env:GITHUB_REF_NAME $exePath $hashPath --repo $env:GITHUB_REPOSITORY --verify-tag --title "Codex Switch Tools $env:GITHUB_REF_NAME" --notes-file $notesPath --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; an existing published release is never overwritten.' }
